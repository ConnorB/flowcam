url: https://connorb.github.io/flowcam/

authors:
  Connor Brown:
    href: https://connorb.github.io/

template:
  light-switch: true
  bootstrap: 5
  opengraph:
    image:
      src: man/figures/logo.png
      alt: "flowcam — USGS stream-gage timelapses in R"
    twitter:
      creator: "@eco_conn"
      site: "@eco_conn"
      card: summary_large_image
  bslib:
    base_font: {google: "Roboto"}
    heading_font: {google: "Roboto Slab"}
    code_font: {google: "Fira Code"}
  includes:
    in_header: |
      <meta property="og:type" content="website" />
      <script>
          window.goatcounter = {
              path: function(p) { return location.host + p }
          }
      </script>
      <script data-goatcounter="https://connor.goatcounter.com/count"
              async src="//gc.zgo.at/count.js"></script>
navbar:
  structure:
    left:
    - intro
    - articles
    - reference
    - news
    right:
    - search
    - github
    - lightswitch
articles:
- title: Vignettes
  navbar: ~
  contents:
  - getting-started
  - pecos-river
